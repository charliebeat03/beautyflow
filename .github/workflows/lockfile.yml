name: Generate pnpm lockfile
# Keep dependency resolution and frozen-install verification in GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "frontend/package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beautyflow-lockfile-main
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.1

      - name: Generate lockfile from workspace manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Validate frozen install
        run: pnpm install --frozen-lockfile

      - name: Commit lockfile if changed (retry on concurrent main updates)
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            pnpm install --lockfile-only --no-frozen-lockfile
            pnpm install --frozen-lockfile
            git add pnpm-lock.yaml
            if git diff --cached --quiet; then
              echo "pnpm-lock.yaml is already current."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: generate pnpm lockfile"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected. Retrying ($attempt/3)..."
          done
          echo "Could not update pnpm-lock.yaml after three attempts."
          exit 1
